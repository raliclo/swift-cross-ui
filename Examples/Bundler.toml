format_version = 2

# Every app compiles against Android API 36. AndroidBackendHelpers.kt calls
# TimeZone.getIanaID, added in API 36, behind a SDK_INT >= 36 runtime check;
# resolving the symbol still needs API 36 at compile time, and Swift Bundler
# defaults compile_sdk to 34.
#
# target_sdk is pinned to 34 so that raising compile_sdk stays a compile-time
# change only. Swift Bundler derives targetSDK as `targetSDK ?? compileSDK`, so
# without this it would follow compile_sdk to 36, and Android applies stricter
# runtime policies at higher target levels.
#
# Verified with `aapt2 dump badging`:
#   compileSdkVersion='36'  targetSdkVersion='34'  sdkVersion:'28'
#
# minSdk stays at Swift Bundler's default of 28, so the set of devices that can
# install these apps is unchanged.

[apps.ControlsExample]
identifier = 'dev.swiftcrossui.ControlsExample'
product = 'ControlsExample'
version = '0.1.0'
android.compile_sdk = 36
android.target_sdk = 34

[[apps.ControlsExample.overlays]]
condition = 'platform(macCatalyst)'
interface_idiom = 'mac'

