# CI for this fork: runs on every push to develop, and by hand.
# 本 fork 的 CI:每次推到 develop 時執行，也可以手動執行。
#
# Six jobs, each covering what the local machines cannot check on every push:
# - macos: the core and AppKitBackend, built and tested (swift test), on the xcode-27 image (macOS 27).
# - ios: the test apps built with xcodebuild and their action files replayed on the
#   iOS Simulator (sweep_apple.zsh), on the xcode-27 image.
# - android: the test apps built for x86_64, installed on an emulator and their
#   action files replayed (sweep_android.zsh), on Ubuntu with KVM.
# - linux: GtkBackend on Ubuntu, built and tested under a virtual X display;
#   there is no bare Linux machine here, so this is the only routine Linux check; SWEEP_APPS replayed from actions/wsl under xvfb (sweep_desktop.zsh).
# - windows: WinUIBackend built, plus SWEEP_APPS through compile.zsh, replayed from actions/win at 125% and photographed (sweep_desktop.zsh).
# - lint: SwiftLint.
# All five platforms sweep P2 P8 P12 P114 P116 P120 P122 P123 P124 P125 P126; macos, linux and windows also sweep P119 (only linux, on GTK, really checks it; ios and android use ci_p119_mobile.zsh); run by hand with full=true for every app.
# macos, linux and windows build P2 and P116 and launch each for 20 s (ci_launch_check.zsh); all three also replay and photograph the same apps (actions/mac, actions/wsl, actions/win; 2026-11-15).
# 六個工作，各自涵蓋本機無法在每次推送時檢查的部分:
# - macos:核心與 AppKitBackend,建置並測試(swift test),使用 xcode-27 映像(macOS 27)。
# - ios:以 xcodebuild 建置測試 app,在 iOS 模擬器上重放動作檔(sweep_apple.zsh),使用 xcode-27 映像。
# - android:以 x86_64 建置測試 app,裝到 emulator 上並重放動作檔(sweep_android.zsh),在有 KVM 的 Ubuntu 上。
# - linux:GtkBackend 在 Ubuntu 上建置，並在虛擬 X 顯示器下測試；這裡沒有實體 Linux 機器，所以這是唯一的例行 Linux 檢查；在 xvfb 下重放 actions/wsl 的 SWEEP_APPS(sweep_desktop.zsh)。
# - windows:建置 WinUIBackend,另以 compile.zsh 建置 SWEEP_APPS,在 125% 下重放 actions/win 並拍照(sweep_desktop.zsh)。
# - lint:SwiftLint。
# 五個平台都跑 P2 P8 P12 P114 P116 P120 P122 P123 P124 P125 P126;macos、linux 與 windows 另外 sweep P119(只有 linux 的 GTK 真正檢查它,ios 與 android 用 ci_p119_mobile.zsh);手動執行時加 full=true 則跑每一支 app。
# macos、linux 與 windows 建置 P2 與 P116,並各啟動 20 秒(ci_launch_check.zsh);三者也重放同一組 app 的動作檔並拍照(actions/mac、actions/wsl、actions/win;2026-11-15)。
#
# Swift 6.4 everywhere, the version the local machines use; Windows names an exact release (6.4.2),
# since its installer has no plain 6.4 download. / 各平台都用 Swift 6.4,與本機相同；Windows 的安裝程式沒有單純的 6.4 下載，所以指定確切版本 6.4.2。
name: CI

on:
  push:
    branches:
      - 'develop'
  workflow_dispatch:
    inputs:
      full:
        # Every app with an action file, instead of the few below (SWEEP_APPS); slow.
        # 跑每一支有動作檔的 app,而不是下面那幾支(SWEEP_APPS);很慢。
        description: 'Sweep every iOS, Android and macOS app (-full)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # xcode-27 (macOS 27.2), not macos-26: Apple platforms need 27 or later since 2026-11-20, so the apps
    # this job builds would not launch on macOS 26. csv2, built for macOS 26, runs on 27 as well.
    # 用 xcode-27(macOS 27.2)而非 macos-26:自 2026-11-20 起 Apple 平台需要 27 以上，本工作建置的 app 在 macOS 26
    # 上無法啟動。為 macOS 26 建置的 csv2 在 27 上同樣能執行。
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      SWEEP_APPS: ${{ inputs.full && 'all' || 'P2 P8 P12 P114 P116 P119 P120 P122 P123 P124 P125 P126' }}
    steps:
    - uses: actions/checkout@v4

    # Package.swift takes swift-winui by URL and revision since 2026-11-14 (a path into this submodule from 2026-11-06); the
    # checkout stays for compile.zsh's HEAD check (P2 and P116 are built below).
    # Package.swift 自 2026-11-14 起以 URL + revision 引用 swift-winui(2026-11-06 起曾是指向這個 submodule 的路徑);保留這次 checkout,是因為下方建置 P2 與 P116 時 compile.zsh 會比對它的 HEAD。
    - name: Check out Vendor/swift-winui
      run: git submodule update --init --depth 1 Vendor/swift-winui

    # Exactly 6.4.2: on 2026-11-24 the plain '6.4' installed 6.4.3, with which swiftbuild found
    # no Darwin platform for any target ("Could not choose a single platform ... android
    # freebsd linux ..."), so the build failed before compiling anything (run 45254378732).
    # 固定為 6.4.2:2026-11-24 單寫 '6.4' 裝到了 6.4.3,而 swiftbuild 用它找不到任何 target 的 Darwin 平台
    # (「Could not choose a single platform ... android freebsd linux ...」),建置在編譯前就失敗(run 45254378732)。
    - name: Install Swift 6.4.2
      uses: SwiftyLab/setup-swift@v1
      with:
        swift-version: '6.4.2'

    - name: Swift version
      run: swift --version

    - name: Install GTK
      run: brew install pkg-config gtk4 || true

    - name: Build and test (core, AppKitBackend)
      run: SCUI_HOST_BACKENDS_ONLY=1 swift test -Xcc -I"$(brew --prefix)/include"

    # compile.zsh records each executable in output/build-manifest.csv2 through csv2.
    # compile.zsh 經由 csv2 把每個執行檔記進 output/build-manifest.csv2。
    - name: Install csv2
      run: |
        v=0.2.0; f=csv2-$v-macos-arm64.tar.zst
        curl -fsSLO "https://github.com/raliclo/csv2/releases/download/v$v/$f"
        curl -fsSLO "https://github.com/raliclo/csv2/releases/download/v$v/$f.sha256"
        shasum -a 256 -c "$f.sha256"
        mkdir -p "$RUNNER_TEMP/csv2" && zstd -dc "$f" | tar -x -C "$RUNNER_TEMP/csv2"
        bin=$(find "$RUNNER_TEMP/csv2" -type f -name csv2 -perm -u+x | head -1)
        test -n "$bin"
        echo "${bin%/*}" >> "$GITHUB_PATH"

    # P2 and P116 on every platform (2026-11-13), and on macOS the rest of SWEEP_APPS for the sweep below (2026-11-15).
    # P2 與 P116 在每個平台(2026-11-13);macOS 另建置 SWEEP_APPS 的其餘 app,供下方的 sweep 使用(2026-11-15)。
    - name: Build the macOS apps (AppKitBackend)
      run: |
        if [ "$SWEEP_APPS" = all ]; then apps=$(ls testapp/actions/mac/P*.actions | sed -E 's|.*/(P[0-9]+)-.*|\1|' | sort -u); else apps=$SWEEP_APPS; fi
        for app in $apps; do zsh testapp/compile.zsh "$app"; done

    # The screen desktop action-file runs assume, 1920x1080 at scale 1 (check_screen_macos).
    # The runner starts at 1024x768; displayplacer lists 1920x1080 as mode 10 and switches
    # to it (run 43580086002, 2026-11-14). The step fails if the switch does not take.
    # 桌面動作檔執行假設的螢幕:1920x1080、縮放 1。runner 起始為 1024x768;displayplacer 列出 1920x1080(mode 10)
    # 並能切換過去(run 43580086002,2026-11-14)。切換沒生效時這一步失敗。
    - name: Screen 1920x1080 (AppKitBackend)
      run: |
        show() { swift -e 'import AppKit; for s in NSScreen.screens { print("screen \(Int(s.frame.width))x\(Int(s.frame.height)) scale \(Int(s.backingScaleFactor))") }'; }
        show
        brew install displayplacer >/dev/null 2>&1
        id=$(displayplacer list | awk '/Persistent screen id:/ {print $4; exit}')
        displayplacer "id:$id res:1920x1080 scaling:off origin:(0,0) degree:0"
        sleep 3
        now=$(show | head -1); echo "$now"
        test "$now" = "screen 1920x1080 scale 1"

    - name: Launch P2 and P116 (AppKitBackend)
      run: |
        zsh testapp/test_support/ci_launch_check.zsh 20 - testapp/output/P2
        zsh testapp/test_support/ci_launch_check.zsh 20 appear-to-hop testapp/output/P116

    # The same apps as the iOS and Android sweeps, replayed from actions/mac/ and photographed
    # (2026-11-15). The launch check above only proves the apps start; this presses them.
    # Locally 8 of 8 files passed (P2 P8 P12 P114 P116) and each capture showed its expected state.
    # 與 iOS、Android sweep 相同的 app,從 actions/mac/ 重放並拍照(2026-11-15)。上面的啟動檢查只證明 app 能啟動，
    # 這一步實際操作它們。本機 8 份檔案全數通過(P2 P8 P12 P114 P116),每張擷圖都顯示預期的狀態。
    - name: macOS sweep (AppKitBackend)
      run: if [ "$SWEEP_APPS" = all ]; then zsh testapp/sweep_apple.zsh --macos; else zsh testapp/sweep_apple.zsh --macos $SWEEP_APPS; fi

    # The sweep exits 0 whatever happened; every row of its table has to be a pass.
    # sweep 無論結果都以 0 結束；結果表的每一列都必須是 pass。
    - name: Every macOS action file passes
      run: |
        t=testapp/output/macos-sweep.csv2
        csv2 -r -i "$t"
        total=$(csv2 -r --json -i "$t" | grep -c '"record":' || true)
        passed=$(csv2 -r --json -i "$t" | grep -c '"result":"pass"' || true)
        echo "$passed of $total pass"
        test "$total" -gt 0 && test "$passed" -eq "$total"

    - name: Upload macOS captures and logs
      if: always()
    # Captures are in testapp/output/screenshots/, where test.zsh writes them; the per-file logs are in output/sweep-macos/.
      uses: actions/upload-artifact@v4
      with:
        name: macos-sweep
        path: |
          testapp/output/macos-sweep.csv2
          testapp/output/screenshots/*-macos-*.png
          testapp/output/sweep-macos/*.log
        if-no-files-found: warn

  ios:
    # Xcode 27 (Swift 6.4) is only on the xcode-27 image; macos-26 still has Xcode 26.
    # Xcode 27(Swift 6.4)只在 xcode-27 映像上；macos-26 仍是 Xcode 26。
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      SWEEP_APPS: ${{ inputs.full && 'all' || 'P2 P8 P12 P114 P116 P120 P122 P123 P124 P125 P126' }}
    steps:
    - uses: actions/checkout@v4

    - name: Check out Vendor/swift-winui
      run: git submodule update --init --depth 1 Vendor/swift-winui

    # The sweep reads action files and writes its table through csv2, as on the local machines.
    # sweep 與本機相同，經由 csv2 讀取動作檔並寫出結果表。
    - name: Install csv2
      run: |
        v=0.2.0; f=csv2-$v-macos-arm64.tar.zst
        curl -fsSLO "https://github.com/raliclo/csv2/releases/download/v$v/$f"
        curl -fsSLO "https://github.com/raliclo/csv2/releases/download/v$v/$f.sha256"
        cat "$f.sha256"
        shasum -a 256 -c "$f.sha256"
        mkdir -p "$RUNNER_TEMP/csv2" && zstd -dc "$f" | tar -x -C "$RUNNER_TEMP/csv2"
        bin=$(find "$RUNNER_TEMP/csv2" -type f -name csv2 -perm -u+x | head -1)
        test -n "$bin"
        echo "${bin%/*}" >> "$GITHUB_PATH"

    - name: Versions
      run: |
        xcodebuild -version
        swift --version
        csv2 --version
        xcrun simctl runtime list
        df -h /

    # Built first, in a step of its own: the sweep's 600 s limit per action file then
    # covers the replay alone. With the build inside it, P114's first file took 550 s
    # in one run and timed out at 678 s in the next (2026-11-07).
    # 先在獨立的步驟裡建置，sweep 每份動作檔 600 秒的上限就只涵蓋重放。建置算在裡面時,P114 的第一份檔案
    # 一次花了 550 秒，下一次在 678 秒逾時(2026-11-07)。
    - name: Build the iOS apps
      run: |
        if [ "$SWEEP_APPS" = all ]; then apps=$(ls testapp/actions/ios/P*.actions | sed -E 's|.*/(P[0-9]+)-.*|\1|' | sort -u); else apps=$SWEEP_APPS; fi
        for app in $apps; do zsh testapp/compile.zsh -ios "$app"; done  # one app per call

    # The cold simulator, on its own and timed, before the sweep: one replay with nothing to press.
    # It took 6 m 1 s of real time against 14 s user and 6 s sys (run 42889204591, 2026-11-10), so
    # the time is spent waiting on the simulator (its first boot and first launch), not compiling
    # here (the control file does not build the XCUITest runner). Without this step the first file
    # carried it: P114-back-labels took 550-699 s and timed out at 600 s; after it, 245 s.
    # 先單獨把冷的模擬器做掉並計時：一次不按任何東西的重放。實際花了 6 分 1 秒，而 user 只有 14 秒、sys 6 秒
    # (run 42889204591,2026-11-10),所以時間花在等模擬器(第一次開機與第一次啟動),不是在這裡編譯(這份對照檔不建 XCUITest runner)。
    # 少了這一步，代價落在 sweep 的第一份檔案:P114-back-labels 要 550-699 秒並在 600 秒逾時；有了它是 245 秒。
    - name: Boot the simulator (timed)
      run: time zsh testapp/test.zsh P114 --ios --showtime 2 --actionfile testapp/actions/ios/_control-no-actions.actions

    # Builds each app with xcodebuild, installs it on the simulator and replays its
    # action files through the XCUITest runner (testapp/sweep_apple.zsh).
    # 以 xcodebuild 建置每支 app、裝到模擬器上，並經由 XCUITest runner 重放它的動作檔。
    - name: iOS sweep
      run: if [ "$SWEEP_APPS" = all ]; then zsh testapp/sweep_apple.zsh --ios; else zsh testapp/sweep_apple.zsh --ios $SWEEP_APPS; fi

    # The sweep exits 0 whatever happened; every row of its table has to be a pass.
    # sweep 無論結果都以 0 結束；結果表的每一列都必須是 pass。
    - name: Every action file passes
      run: |
        t=testapp/output/ios-sweep.csv2
        csv2 -r -i "$t"
        total=$(csv2 -r --json -i "$t" | grep -c '"record":' || true)
        passed=$(csv2 -r --json -i "$t" | grep -c '"result":"pass"' || true)
        echo "$passed of $total pass"
        test "$total" -gt 0 && test "$passed" -eq "$total"

    # P119 runs its own steps here instead of replaying its action file: it must print SKIP, end by itself and not crash.
    # The Android job runs the same check inside its emulator step (2026-11-19).
    # P119 在這裡自己跑完步驟，不重放動作檔：必須印出 SKIP、自己結束且不當掉。Android 工作在 emulator 步驟裡做同樣的檢查(2026-11-19)。
    - name: P119 ends cleanly
      run: zsh testapp/test_support/ci_p119_mobile.zsh --ios

    - name: Upload captures and logs
      if: always()
    # Captures are in testapp/output/screenshots/, where test_ios.zsh writes them. No trailing comment on a path line: inside the | block it is part of the path, and 88471f7d's matched nothing (2026-11-14).
      uses: actions/upload-artifact@v4
      with:
        name: ios-sweep
        path: |
          testapp/output/ios-sweep.csv2
          testapp/output/screenshots/*-ios-*.png
          testapp/output/*.log
        if-no-files-found: warn

  android:
    # An x86_64 Linux runner: GitHub's Apple Silicon runners cannot nest an emulator,
    # and Linux runners have KVM. The apps are built for x86_64 here (ANDROID_TRIPLE),
    # so the emulator runs them natively; the local machines use arm64.
    # x86_64 Linux runner:GitHub 的 Apple Silicon runner 無法再套一層 emulator,Linux runner 則有 KVM。
    # 這裡的 app 以 x86_64 建置(ANDROID_TRIPLE),emulator 原生執行；本機用的是 arm64。
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SWEEP_APPS: ${{ inputs.full && 'all' || 'P2 P8 P12 P114 P116 P120 P122 P123 P124 P125 P126' }}
      ANDROID_TRIPLE: x86_64-unknown-linux-android31
      ANDROID_NDK_VERSION: 30.0.16248370
      SCUI_ANDROID_SOFTWARE_GL: 1  # no GPU on this runner; see test_android.zsh / 這台 runner 沒有 GPU
    steps:
    - uses: actions/checkout@v4

    - name: Check out Vendor/swift-winui
      run: git submodule update --init --depth 1 Vendor/swift-winui

    # The toolchain must be the exact release the Android SDK was built with.
    # toolchain 必須與 Android SDK 建置時所用的版本完全相同。
    - name: Install Swift 6.4.0
      uses: SwiftyLab/setup-swift@v1
      with:
        swift-version: '6.4.0'

    - name: Install zsh, csv2 and JDK 17
      run: |
        sudo apt-get update
        sudo apt-get install -y zsh zstd rsync imagemagick
        v=0.2.0; f=csv2-$v-linux-x86_64-glibc.tar.zst
        curl -fsSLO "https://github.com/raliclo/csv2/releases/download/v$v/$f"
        curl -fsSLO "https://github.com/raliclo/csv2/releases/download/v$v/$f.sha256"
        sha256sum -c "$f.sha256"
        mkdir -p "$RUNNER_TEMP/csv2" && zstd -dc "$f" | tar -x -C "$RUNNER_TEMP/csv2"
        bin=$(find "$RUNNER_TEMP/csv2" -type f -name csv2 -perm -u+x | head -1)
        test -n "$bin"
        echo "${bin%/*}" >> "$GITHUB_PATH"

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    # NDK r30, which the Swift 6.4 Android SDK requires; the checksum is the one
    # swift.org publishes (also in testapp/install_tools_android.zsh).
    # NDK r30 是 Swift 6.4 Android SDK 所需；checksum 是 swift.org 公布的那一個(亦見 install_tools_android.zsh)。
    - name: Install the NDK and the Swift Android SDK
      run: |
        sdkmanager=$(ls "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager)
        yes | "$sdkmanager" --licenses > /dev/null || true
        "$sdkmanager" --install "ndk;$ANDROID_NDK_VERSION"
        ndk="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
        test -d "$ndk/toolchains/llvm/prebuilt"
        echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
        swift sdk install \
          https://download.swift.org/swift-6.4.0-release/android-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_android.artifactbundle.tar.gz \
          --checksum 21fb555122a3d801ad943d48df7ebffdd8824de61c25c180bb792d3edaee0b43
        # Linux keeps it under ~/.swiftpm or ~/.config/swiftpm depending on the toolchain; find it.
        # Linux 視 toolchain 而定放在 ~/.swiftpm 或 ~/.config/swiftpm;直接找。
        bundle=$(find "$HOME/.swiftpm" "$HOME/.config/swiftpm" -maxdepth 3 -type d -name '*android.artifactbundle' 2>/dev/null | head -1)
        [ -n "$bundle" ] || { echo "not found; searching /:"; find / -xdev -type d -name '*android.artifactbundle' 2>/dev/null | head; exit 1; }
        echo "SWIFT_SDKS_DIR=${bundle%/*}" >> "$GITHUB_ENV"
        echo "Swift Android SDK: $bundle"
        ANDROID_NDK_HOME="$ndk" bash "$bundle/swift-android/scripts/setup-android-sdk.sh"
        swift sdk list

    - name: Disk space
      run: df -h / "$RUNNER_TEMP"

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # The capture check that a screen is not all black reduces each capture with ImageMagick
    # here (sips on macOS). A control on each side, so the check is known to be able to fail.
    # 判斷畫面不是全黑的截圖檢查，在這裡以 ImageMagick 縮圖(macOS 用 sips)。兩邊各一個對照組，確認這個檢查會失敗。
    - name: Black-screen check control
      run: |
        convert -size 64x64 xc:black "$RUNNER_TEMP/black.png"
        convert -size 64x64 xc:white "$RUNNER_TEMP/white.png"
        fn=$(sed -n '/^nonblack_pixels() {/,/^}/p' testapp/test_android.zsh)
        black=$(zsh -c "$fn"$'\nnonblack_pixels "$1"' _ "$RUNNER_TEMP/black.png")
        white=$(zsh -c "$fn"$'\nnonblack_pixels "$1"' _ "$RUNNER_TEMP/white.png")
        echo "black=$black white=$white"
        test "$black" = 0 && test "$white" = 256

    # Builds, packages and installs each app, then replays its action files
    # (testapp/sweep_android.zsh), on an emulator this step starts.
    # 建置、打包並安裝每支 app,再重放它的動作檔(sweep_android.zsh),在這一步啟動的 emulator 上。
    - name: Android sweep
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        profile: pixel_6  # the local AVD's screen, 1080 x 2400 px at 420 dpi: Android action files are measured on it (2026-11-14) / 本機 AVD 的螢幕，動作檔在其上量測
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
        script: |
          mkdir -p testapp/output && zsh testapp/sweep_android.zsh $([ "$SWEEP_APPS" = all ] || echo $SWEEP_APPS) 2>&1 | tee testapp/output/android-sweep-stdout.txt
          zsh testapp/test_support/ci_p119_mobile.zsh --android

    # The sweep exits 0 whatever happened. Its last count line is the verdict: a row passes
    # when test.zsh exited 0 and the app launched (sweep_android.zsh), and none may fail.
    # sweep 無論結果都以 0 結束。最後那行計數就是結論：test.zsh 以 0 結束且 app 有啟動才算通過，不能有任何一列失敗。
    - name: Every action file passes
      run: |
        csv2 -r -i testapp/output/android-sweep.csv2
        line=$(grep -E '^[0-9]+ launched, [0-9]+ did not' testapp/output/android-sweep-stdout.txt)
        echo "$line"
        echo "$line" | grep -qE '^[1-9][0-9]* launched, 0 did not'

    - name: Upload captures and logs
      if: always()
    # Captures are in testapp/output/screenshots/, where test_android.zsh writes them. No trailing comment on a path line: inside the | block it is part of the path, and 88471f7d's matched nothing (2026-11-14).
      uses: actions/upload-artifact@v4
      with:
        name: android-sweep
        path: |
          testapp/output/android-sweep.csv2
          testapp/output/android-sweep-stdout.txt
          testapp/output/screenshots/*-android-*.png
          testapp/output/*.log
        if-no-files-found: warn

  linux:
    # Ubuntu 26.04 since 2026-11-17, the user's choice: the same release as this
    # machine's WSL, so GTK is 4.22 on both. On 24.04 (GTK 4.14.5) P8's closing
    # vertical scroll never reached the outer view, while WSL's 4.22.4 passed on bare
    # Xvfb and with openbox (todo.md). develop requires GTK 4.22 (gtk_helpers.c); 4.14 lives on Ubuntu-24-04-branch.
    # 自 2026-11-17 起用 Ubuntu 26.04,使用者的選擇：與本機 WSL 同一版，兩邊的 GTK 都是 4.22。在 24.04(GTK 4.14.5)上 P8 最後的
    # 垂直捲動到不了外層，而 WSL 的 4.22.4 在純 Xvfb 與加 openbox 時都通過(todo.md);develop 要求 GTK 4.22(gtk_helpers.c);4.14 由 Ubuntu-24-04-branch 支援。
    runs-on: ubuntu-26.04
    env:
      SWEEP_APPS: ${{ inputs.full && 'all' || 'P2 P8 P12 P114 P116 P119 P120 P122 P123 P124 P125 P126' }}
    steps:
    - uses: actions/checkout@v4

    # Package.swift takes swift-winui by URL and revision since 2026-11-14 (a path into this submodule from 2026-11-06); the
    # checkout stays for compile.zsh's HEAD check.
    # Package.swift 自 2026-11-14 起以 URL + revision 引用 swift-winui(2026-11-06 起曾是指向這個 submodule 的路徑);保留這次 checkout,是因為 compile.zsh 會比對它的 HEAD。
    - name: Check out Vendor/swift-winui
      run: git submodule update --init --depth 1 Vendor/swift-winui

    - name: Install Swift 6.4
      uses: SwiftyLab/setup-swift@v1
      with:
        swift-version: '6.4'

    - name: Swift version
      run: swift --version

    - name: Install GTK and a virtual X display
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-4-dev clang zsh zstd xvfb x11-xserver-utils xdotool imagemagick openbox

    - name: Build GtkBackend
      run: SCUI_HOST_BACKENDS_ONLY=1 swift build --target GtkBackend

    - name: Test
      run: SCUI_HOST_BACKENDS_ONLY=1 xvfb-run --auto-servernum swift test

    # compile.zsh records each executable in output/build-manifest.csv2 through csv2.
    # compile.zsh 經由 csv2 把每個執行檔記進 output/build-manifest.csv2。
    - name: Install csv2
      run: |
        v=0.2.0; f=csv2-$v-linux-x86_64-glibc.tar.zst
        curl -fsSLO "https://github.com/raliclo/csv2/releases/download/v$v/$f"
        curl -fsSLO "https://github.com/raliclo/csv2/releases/download/v$v/$f.sha256"
        sha256sum -c "$f.sha256"
        mkdir -p "$RUNNER_TEMP/csv2" && zstd -dc "$f" | tar -x -C "$RUNNER_TEMP/csv2"
        bin=$(find "$RUNNER_TEMP/csv2" -type f -name csv2 -perm -u+x | head -1)
        test -n "$bin"
        # A csv2 that cannot load fails here, not silently later (macOS, 2026-11-15).
        # 無法載入的 csv2 在這裡就失敗，而不是之後默默失敗(macOS,2026-11-15)。
        "$bin" --version
        echo "${bin%/*}" >> "$GITHUB_PATH"

    # P2 and P116 on every platform (2026-11-13); see the windows job. Since
    # 2026-11-15 all of SWEEP_APPS, SCUI_DEBUG=1 so -actionfile is compiled in.
    # P2 與 P116 在每個平台(2026-11-13);見 windows 工作。自 2026-11-15 起建置整個 SWEEP_APPS,以 SCUI_DEBUG=1 編入 -actionfile。
    - name: Build SWEEP_APPS (GtkBackend, SCUI_DEBUG=1)
      run: |
        if [ "$SWEEP_APPS" = all ]; then apps=$(ls testapp/actions/wsl/P*.actions | sed -E 's|.*/(P[0-9]+)-.*|\1|' | sort -u); else apps=$SWEEP_APPS; fi
        for app in $apps; do SCUI_DEBUG=1 zsh testapp/compile.zsh "$app"; done

    # The X screen a replay would see (todo item 14): 1920x1080, as WSLg's here and
    # as test.zsh's check_screen_wsl expects. xvfb-run's own default is 640x480x8.
    # 重放會看到的 X 螢幕(todo 第 14 項):1920x1080,與這裡 WSLg 的相同，也是 test.zsh 的 check_screen_wsl 預期的值。
    # xvfb-run 自己的預設是 640x480x8。
    - name: Screen (1920x1080, as the action files assume)
      run: xvfb-run --auto-servernum -s "-screen 0 1920x1080x24" xrandr --current

    - name: Launch P2 and P116 (GtkBackend)
      run: |
        xvfb-run --auto-servernum -s "-screen 0 1920x1080x24" zsh testapp/test_support/ci_launch_check.zsh 20 - testapp/output/P2
        xvfb-run --auto-servernum -s "-screen 0 1920x1080x24" zsh testapp/test_support/ci_launch_check.zsh 20 appear-to-hop testapp/output/P116

    # The same apps as the other sweeps, replayed from actions/wsl/ and photographed
    # (2026-11-15, the user's request: every platform replays and photographs the CI
    # app set). testapp/sweep_desktop.zsh launches each app itself with -actionfile,
    # since test.zsh reaches Linux only through wsl.exe; xdotool does the clicks.
    # A window manager (openbox) runs inside the Xvfb session since 2026-11-17, the
    # user's decision: without one GTK drew no title bar, so P2's #401 check (the
    # maximise button returns) could not be seen in the capture. It also tells apart
    # the causes of P8-scroll-strip-sideways step 6 failing on bare Xvfb (todo.md);
    # that file now fails its row through `# expect:` when the outer view stays put.
    # 與其他 sweep 相同的 app,從 actions/wsl/ 重放並拍照(2026-11-15,使用者的要求：每個平台都重放並拍攝 CI 的 app 組)。
    # testapp/sweep_desktop.zsh 自己以 -actionfile 啟動每支 app,因為 test.zsh 只能經 wsl.exe 抵達 Linux;點擊由 xdotool 完成。
    # 自 2026-11-17 起 Xvfb 工作階段裡執行視窗管理員(openbox),使用者的決定：沒有它時 GTK 不畫標題列,P2 的 #401 檢查(最大化鈕
    # 回來)在擷圖裡看不到。它也能分辨 P8-scroll-strip-sideways 第 6 步在純 Xvfb 上失敗的成因(todo.md);外層不動時，該檔現在
    # 經由 `# expect:` 讓該列失敗。
    - name: Linux sweep (GtkBackend, openbox on Xvfb)
      run: |
        if [ "$SWEEP_APPS" = all ]; then set --; else set -- $SWEEP_APPS; fi
        xvfb-run --auto-servernum -s "-screen 0 1920x1080x24" \
          zsh -c 'openbox >/dev/null 2>&1 & sleep 2; xprop -root _NET_SUPPORTING_WM_CHECK; zsh testapp/sweep_desktop.zsh --linux "$@"' sweep "$@"

    # The sweep exits 0 whatever happened; every row of its table has to be a pass.
    # sweep 無論結果都以 0 結束；結果表的每一列都必須是 pass。
    - name: Every Linux action file passes
      run: |
        t=testapp/output/linux-sweep.csv2
        csv2 -r -i "$t"
        total=$(csv2 -r --json -i "$t" | grep -c '"record":' || true)
        passed=$(csv2 -r --json -i "$t" | grep -c '"result":"pass"' || true)
        echo "$passed of $total pass"
        test "$total" -gt 0 && test "$passed" -eq "$total"

    - name: Upload Linux captures and logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: linux-sweep
        path: |
          testapp/output/linux-sweep.csv2
          testapp/output/screenshots/*-linux-final-*.png
          testapp/output/sweep-linux/*.log
          testapp/output/sweep-linux/*-desktop.png
        if-no-files-found: warn

  windows:
    runs-on: windows-latest
    env:
      SWEEP_APPS: ${{ inputs.full && 'all' || 'P2 P8 P12 P114 P116 P119 P120 P122 P123 P124 P125 P126' }}
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@v4

    # Package.swift takes swift-winui by URL and revision since 2026-11-14 (a path into this submodule from 2026-11-06); the
    # checkout stays for Support/generate-bindings.zsh and compile.zsh's HEAD check.
    # Package.swift 自 2026-11-14 起以 URL + revision 引用 swift-winui(2026-11-06 起曾是指向這個 submodule 的路徑);保留這次 checkout,是因為 Support/generate-bindings.zsh 在裡面，compile.zsh 也會比對它的 HEAD。
    - name: Check out Vendor/swift-winui
      run: git submodule update --init --depth 1 Vendor/swift-winui

    - name: Setup VS Dev Environment
      uses: seanmiddleditch/gha-setup-vsdevenv@v5

    - name: Install Swift 6.4.2
      uses: compnerd/gha-setup-swift@v0.3.0
      with:
        branch: swift-6.4.2-release
        tag: 6.4.2-RELEASE

    - name: Swift version
      run: swift --version

    # One test app through testapp/compile.zsh, the way W11 builds them, to learn what
    # an app costs on this runner before adding more: a WinUI exe is ~234 MB stripped
    # (matrix_coverage/executable-size.md).
    # 以 testapp/compile.zsh 建置一支測試 app(與 W11 相同),先看一支 app 在這台 runner 上的代價再決定加多少：
    # WinUI exe strip 後約 234 MB(matrix_coverage/executable-size.md)。
    - name: Disk space before the app
      run: Get-PSDrive -PSProvider FileSystem | Format-Table Name,Used,Free -AutoSize

    # zsh comes from MSYS2 but runs inside Git Bash, as on W11 (zsh 5.9 x86_64-pc-cygwin under
    # MINGW64). Run from MSYS2's own shell, SwiftPM failed every clone with no further detail
    # ("Failed to clone repository", 2026-11-07).
    # zsh 取自 MSYS2,但在 Git Bash 裡執行，與 W11 相同(MINGW64 下的 zsh 5.9 x86_64-pc-cygwin)。在 MSYS2
    # 自己的 shell 裡執行時,SwiftPM 的每一次 clone 都失敗，且沒有其他細節(2026-11-07)。
    - uses: msys2/setup-msys2@v2
      id: msys2
      with:
        msystem: MSYS
        path-type: inherit
        install: zsh

    - name: Put zsh into Git Bash
      shell: msys2 {0}
      run: |
        git_usr="$(cygpath -u 'C:\Program Files\Git\usr')"
        cp -v /usr/bin/zsh*.exe "$git_usr/bin/"
        for dll in $(ldd /usr/bin/zsh.exe | awk '/\/usr\/bin\// {print $3}'); do
          [ -e "$git_usr/bin/${dll##*/}" ] || cp -v "$dll" "$git_usr/bin/"
        done
        cp -r /usr/lib/zsh "$git_usr/lib/"
        cp -r /usr/share/zsh "$git_usr/share/"

    - name: What Git Bash sees
      shell: bash
      run: |
        uname -s; zsh --version; command -v git swift; git --version; swift --version
        echo "HOME=$HOME TMP=$TMP TEMP=$TEMP"

    # C and C++ through Visual Studio's clang 22+, not Swift's own. Image win25-vs2026 20261116.315
    # brought MSVC 14.52, whose STL stops clang before 22 with STL1000, and Swift 6.4.2 ships clang
    # 21.1.6: run 44439590435 failed in WinUIInterop's hide_others.cpp. SwiftPM ignores CC, CXX and
    # PATH for this, so a toolset names the compiler; compile.zsh passes it on (SCUI_SWIFT_TOOLSET).
    # The step fails if the image has no clang 22 or newer.
    # C 與 C++ 改用 Visual Studio 的 clang 22 以上，而不是 Swift 自己的。映像 win25-vs2026 20261116.315 帶來 MSVC 14.52,
    # 它的 STL 以 STL1000 擋下 22 以前的 clang,而 Swift 6.4.2 附的是 clang 21.1.6:run 44439590435 在 WinUIInterop 的
    # hide_others.cpp 失敗。SwiftPM 在這件事上不理會 CC、CXX 與 PATH,所以由 toolset 指定編譯器;compile.zsh 會把它傳下去
    # (SCUI_SWIFT_TOOLSET)。映像沒有 clang 22 以上時這一步失敗。
    - name: C/C++ compiler (Visual Studio clang 22+)
      shell: bash
      run: |
        toolset=$(zsh testapp/test_support/vs_clang_toolset.zsh "$(cygpath -u "$RUNNER_TEMP")/vs-clang-toolset.json")
        cat "$(cygpath -u "$toolset")"
        echo "SCUI_SWIFT_TOOLSET=$toolset" >> "$GITHUB_ENV"

    - name: Build WinUIBackend
      run: swift build --target WinUIBackend --toolset $env:SCUI_SWIFT_TOOLSET

    # wincap writes a BMP; screenshot.zsh uses FFmpeg to produce the required PNG.
    # wincap 寫出 BMP；screenshot.zsh 用 FFmpeg 轉成驗收所需的 PNG。
    - name: Install FFmpeg for Windows screenshots
      run: |
        if (-not (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue)) {
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg installation failed: $LASTEXITCODE" }
          Join-Path $env:ChocolateyInstall 'bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        }

    - name: Verify FFmpeg in the Windows screenshot shell
      shell: bash
      run: zsh -c 'ffmpeg -version'

    # compile.zsh records each exe in output/build-manifest.csv2 through csv2.
    # compile.zsh 經由 csv2 把每個 exe 記進 output/build-manifest.csv2。
    - name: Install csv2
      shell: bash
      run: |
        v=0.2.0; f=csv2-$v-windows-x86_64.tar.zst
        curl -fsSLO "https://github.com/raliclo/csv2/releases/download/v$v/$f"
        curl -fsSLO "https://github.com/raliclo/csv2/releases/download/v$v/$f.sha256"
        sha256sum -c "$f.sha256"
        dir="$(cygpath -u "$RUNNER_TEMP")/csv2"; mkdir -p "$dir" && zstd -dc "$f" | tar -x -C "$dir"
        bin=$(find "$dir" -type f -iname 'csv2.exe' | head -1)
        test -n "$bin"
        # A csv2 that cannot load fails here, not silently later (macOS, 2026-11-15).
        # 無法載入的 csv2 在這裡就失敗，而不是之後默默失敗(macOS,2026-11-15)。
        "$bin" --version
        cygpath -w "${bin%/*}" >> "$GITHUB_PATH"

    # SWEEP_APPS through testapp/compile.zsh, the way W11 builds them, SCUI_DEBUG=1 so
    # -actionfile is compiled in (2026-11-15; P114 alone from 2026-11-10, P2 and P116
    # from 2026-11-13). Two jobs: four once cost the runner its memory (2026-11-10).
    # 以 testapp/compile.zsh 建置 SWEEP_APPS(與 W11 相同),SCUI_DEBUG=1 以編入 -actionfile(2026-11-15;2026-11-10 起只有 P114,
    # 2026-11-13 起加上 P2 與 P116)。兩個 job:四個曾耗盡 runner 記憶體(2026-11-10)。
    - name: Build SWEEP_APPS (WinUIBackend, SCUI_DEBUG=1)
      shell: bash
      run: |
        if [ "$SWEEP_APPS" = all ]; then apps=$(ls testapp/actions/win/P*.actions | sed -E 's|.*/(P[0-9]+)-.*|\1|' | sort -u); else apps=$SWEEP_APPS; fi
        for app in $apps; do SCUI_DEBUG=1 SCUI_BUILD_JOBS=2 zsh testapp/compile.zsh "$app"; done

    # The WinUI apps need the Windows App Runtime 2.6 (bindings built against Windows App
    # SDK 2.6.5), which this image does not have. Pinned to 2.6.5; the installer's
    # Microsoft signature is checked before it runs.
    # WinUI app 需要 Windows App Runtime 2.6(bindings 以 Windows App SDK 2.6.5 建置),這個映像沒有。
    # 固定為 2.6.5;執行前先檢查安裝檔的 Microsoft 簽章。
    - name: Install the Windows App Runtime 2.6
      run: |
        $f = Join-Path $env:RUNNER_TEMP WindowsAppRuntimeInstall-x64.exe
        Invoke-WebRequest -Uri https://aka.ms/windowsappsdk/2.6/2.6.5/windowsappruntimeinstall-x64.exe -OutFile $f
        $sig = Get-AuthenticodeSignature $f
        "$($sig.Status) $($sig.SignerCertificate.Subject)"
        if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") { throw "installer signature: $($sig.Status)" }
        & $f --quiet
        if ($LASTEXITCODE -ne 0) { throw "installer exited $LASTEXITCODE" }
        Get-AppxPackage -AllUsers *WindowsAppRuntime* | Format-Table Name,Version -AutoSize

    # The screen a replay would see (todo item 14; the user's rule, 2026-11-14: CI
    # and local replay at the same resolution). testapp/actions/win was measured at
    # 1920x1080 and 125%, and test.zsh's check_screen_windows expects exactly that.
    # The resolution is set where Set-DisplayResolution exists; the scale is only
    # printed until a way to set it on the runner has been tried and seen to work.
    # 重放會看到的螢幕(todo 第 14 項;使用者的規則,2026-11-14:CI 與本機在同一解析度上重放)。testapp/actions/win 是在
    # 1920x1080、125% 下量的,test.zsh 的 check_screen_windows 預期的正是這個。有 Set-DisplayResolution 的地方就設定解析度；
    # 縮放比例只印出，直到在 runner 上試過並確認某種設定方法有效為止。
    - name: Screen (1920x1080 at 125%, as testapp/actions/win assumes)
      run: |
        if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) {
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { "Set-DisplayResolution failed: $_" }
        } else {
          "Set-DisplayResolution is not available on this runner"
        }
        Get-CimInstance Win32_VideoController | Format-List Name,CurrentHorizontalResolution,CurrentVerticalResolution
        Get-ItemProperty 'HKCU:\Control Panel\Desktop' -Name LogPixels -ErrorAction SilentlyContinue | Format-List LogPixels
        Get-ItemProperty 'HKCU:\Control Panel\Desktop\WindowMetrics' -Name AppliedDPI -ErrorAction SilentlyContinue | Format-List AppliedDPI

    # todo item 14, option 2 (the user's choice, 2026-11-14): put the runner at
    # 125%, the scale testapp/actions/win was measured at, through the per-monitor
    # scale API (display_scale.zsh). Proven in run 43602448487: 100% and 96 dpi
    # before, 125% and 120 dpi for a process started after. The step fails if the
    # scale does not take, or a process started after it does not see 120 dpi.
    # todo 第 14 項選項 2(使用者的選擇,2026-11-14):把 runner 設成 125%,也就是 testapp/actions/win 量測時的縮放，透過每台
    # 顯示器的縮放 API(display_scale.zsh)。在 43602448487 證實：設定前 100%、96 dpi,之後啟動的行程為 125%、120 dpi。縮放沒有生效，
    # 或之後啟動的行程看不到 120 dpi,這一步就失敗。
    - name: Display scale 125% (as testapp/actions/win assumes)
      shell: bash
      run: |
        zsh testapp/test_support/display_scale.zsh get
        zsh testapp/test_support/display_scale.zsh set 125
        after=$(zsh testapp/test_support/display_scale.zsh get)
        printf '%s\n' "$after"
        printf '%s\n' "$after" | grep -q 'effective dpi 120 '

    - name: Launch P2 and P116 (WinUIBackend)
      shell: bash
      run: |
        zsh testapp/test_support/ci_launch_check.zsh 20 - testapp/output/P2-WinUI.exe
        zsh testapp/test_support/ci_launch_check.zsh 20 appear-to-hop testapp/output/P116-WinUI.exe

    # Each app has to show its own window. Staying up is not enough on Windows: with no
    # Windows App Runtime the loader leaves a "This application could not be started"
    # dialog up under the exe's name, and P2 passed the 20 s check that way in run
    # 43376857271. Seen in run 43381098541 through MainWindowTitle.
    # 每支 app 都必須顯示自己的視窗。在 Windows 上只是活著還不夠：少了 Windows App Runtime 時，載入器會以 exe 的名稱
    # 留下「This application could not be started」對話框,run 43376857271 的 P2 就是這樣通過 20 秒檢查的。
    # 這是在 run 43381098541 經由 MainWindowTitle 看到的。
    - name: P2 and P116 show their own windows (WinUIBackend)
      run: |
        # A crash dump of anything that dies here, read with the SDK's cdb: P116 exited
        # 0xC0000409 in run 43389319635 (fail-fast: a Swift trap or a CRT invalid parameter).
        # 這裡當掉的行程留下傾印，用 SDK 的 cdb 讀取:run 43389319635 中 P116 以 0xC0000409 結束(快速失敗：Swift trap 或 CRT 無效參數)。
        $dumps = Join-Path $env:RUNNER_TEMP dumps; New-Item -ItemType Directory -Force $dumps | Out-Null
        $key = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps"
        New-Item -Force $key | Out-Null; Set-ItemProperty $key DumpFolder $dumps; Set-ItemProperty $key DumpType 2 -Type DWord
        $apps = [ordered]@{ "P2-WinUI.exe" = "P2 WinUI controls and styling"; "P116-WinUI.exe" = "P116 layout timing" }
        $failed = 0
        foreach ($exe in $apps.Keys) {
          $p = Start-Process -FilePath "testapp/output/$exe" -PassThru; $null = $p.Handle  # keeps the handle, so ExitCode is readable after it exits
          Start-Sleep -Seconds 15
          $p.Refresh()
          "$exe exited=$($p.HasExited) code=$(if ($p.HasExited) { "0x{0:X8}" -f $p.ExitCode }) title=[$($p.MainWindowTitle)] expected=[$($apps[$exe])]"
          if ($p.HasExited -or $p.MainWindowTitle -ne $apps[$exe]) { $failed++ }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id }
        }
        $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
        Get-ChildItem $dumps -Filter *.dmp -ErrorAction SilentlyContinue | ForEach-Object {
          "-- dump $($_.Name)"
          if (Test-Path $cdb) { & $cdb -z $_.FullName -c ".ecxr; kn 40; q" | Select-String -Pattern "^\s*[0-9a-f]{2} |ExceptionCode|ucrtbase|Exception" } else { "no cdb at $cdb" }
        }
        if ($failed) { throw "$failed app(s) did not show their own window" }

    # The same apps as the other sweeps, replayed from actions/win/ through test.zsh
    # (testapp/sweep_desktop.zsh) at 1920x1080 and 125%, and photographed (2026-11-15,
    # the user's request: every platform replays and photographs the CI app set). Locally all 8 files passed and each capture was checked against its file's header.
    # 與其他 sweep 相同的 app,經 test.zsh(testapp/sweep_desktop.zsh)在 1920x1080、125% 下從 actions/win/ 重放並拍照
    # (2026-11-15,使用者的要求：每個平台都重放並拍攝 CI 的 app 組)。本機 8 份全部通過，每張擷圖都對照檔頭核對過。
    - name: Windows sweep (WinUIBackend)
      shell: bash
      run: |
        if [ "$SWEEP_APPS" = all ]; then set --; else set -- $SWEEP_APPS; fi
        zsh testapp/sweep_desktop.zsh --windows "$@"

    # The sweep exits 0 whatever happened; every row of its table has to be a pass.
    # sweep 無論結果都以 0 結束；結果表的每一列都必須是 pass。
    - name: Every Windows action file passes
      shell: bash
      run: |
        t=testapp/output/windows-sweep.csv2
        csv2 -r -i "$t"
        total=$(csv2 -r --json -i "$t" | grep -c '"record":' || true)
        passed=$(csv2 -r --json -i "$t" | grep -c '"result":"pass"' || true)
        echo "$passed of $total pass"
        test "$total" -gt 0 && test "$passed" -eq "$total"

    - name: Upload Windows captures and logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: windows-sweep
        path: |
          testapp/output/windows-sweep.csv2
          testapp/output/screenshots/*-windows-final-*.png
          testapp/output/sweep-windows/*.log
        if-no-files-found: warn

    - name: Disk space after the app
      if: always()
      run: |
        Get-PSDrive -PSProvider FileSystem | Format-Table Name,Used,Free -AutoSize
        Get-ChildItem testapp/output -ErrorAction SilentlyContinue | Format-Table Name,Length -AutoSize
        if (Test-Path testapp/.compile-work-winui) { "{0:N1} GB in .compile-work-winui" -f ((Get-ChildItem testapp/.compile-work-winui -Recurse -File -Force | Measure-Object Length -Sum).Sum / 1GB) }

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: SwiftLint
      uses: norio-nomura/action-swiftlint@3.2.1
