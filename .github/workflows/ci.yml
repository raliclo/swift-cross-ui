# CI for this fork: runs on every push to develop, and by hand.
# 本 fork 的 CI:每次推到 develop 時執行，也可以手動執行。
#
# Four jobs, each covering what the local machines cannot check on every push:
# - macos: the core and AppKitBackend, built and tested (swift test).
# - linux: GtkBackend on Ubuntu, built and tested under a virtual X display;
#   there is no bare Linux machine here, so this is the only routine Linux check.
# - windows: WinUIBackend built (no tests), so a change made on a Mac is known
#   to compile on Windows.
# - lint: SwiftLint.
# iOS and Android are tested locally on the simulator and the emulator, not here.
# 四個工作，各自涵蓋本機無法在每次推送時檢查的部分:
# - macos:核心與 AppKitBackend,建置並測試(swift test)。
# - linux:GtkBackend 在 Ubuntu 上建置，並在虛擬 X 顯示器下測試；這裡沒有實體 Linux 機器，所以這是唯一的例行 Linux 檢查。
# - windows:建置 WinUIBackend(不跑測試),確認在 Mac 上做的修改在 Windows 上編得過。
# - lint:SwiftLint。
# iOS 與 Android 在本機的模擬器上測試，不在這裡。
#
# Swift 6.4 everywhere, the version the local machines use; Windows names an exact release (6.4.2),
# since its installer has no plain 6.4 download. / 各平台都用 Swift 6.4,與本機相同；Windows 的安裝程式沒有單純的 6.4 下載，所以指定確切版本 6.4.2。
name: CI

on:
  push:
    branches:
      - 'develop'
      - 'ci-mobile'  # temporary, while the mobile jobs are brought up
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4

    # Package.swift takes swift-winui by path from this submodule on every host
    # (2026-11-06), and checkout@v4 leaves submodules empty.
    # Package.swift 在每個主機上都以路徑引用這個 submodule(2026-11-06),checkout@v4 不會取出 submodule。
    - name: Check out Vendor/swift-winui
      run: git submodule update --init --depth 1 Vendor/swift-winui

    - name: Install Swift 6.4
      uses: SwiftyLab/setup-swift@v1
      with:
        swift-version: '6.4'

    - name: Swift version
      run: swift --version

    - name: Install GTK
      run: brew install pkg-config gtk4 || true

    - name: Build and test (core, AppKitBackend)
      run: SCUI_HOST_BACKENDS_ONLY=1 swift test -Xcc -I"$(brew --prefix)/include"

  ios:
    # Xcode 27 (Swift 6.4) is only on the xcode-27 image; macos-26 still has Xcode 26.
    # Xcode 27(Swift 6.4)只在 xcode-27 映像上；macos-26 仍是 Xcode 26。
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4

    - name: Check out Vendor/swift-winui
      run: git submodule update --init --depth 1 Vendor/swift-winui

    # The sweep reads action files and writes its table through csv2, as on the local machines.
    # sweep 與本機相同，經由 csv2 讀取動作檔並寫出結果表。
    - name: Install csv2
      run: |
        v=0.2.0; f=csv2-$v-macos-arm64.tar.zst
        curl -fsSLO "https://github.com/raliclo/csv2/releases/download/v$v/$f"
        curl -fsSLO "https://github.com/raliclo/csv2/releases/download/v$v/$f.sha256"
        cat "$f.sha256"
        shasum -a 256 -c "$f.sha256"
        mkdir -p "$RUNNER_TEMP/csv2" && zstd -dc "$f" | tar -x -C "$RUNNER_TEMP/csv2"
        bin=$(find "$RUNNER_TEMP/csv2" -type f -name csv2 -perm -u+x | head -1)
        test -n "$bin"
        echo "${bin%/*}" >> "$GITHUB_PATH"

    - name: Versions
      run: |
        xcodebuild -version
        swift --version
        csv2 --version
        xcrun simctl runtime list

    # Builds each app with xcodebuild, installs it on the simulator and replays its
    # action files through the XCUITest runner (testapp/sweep_apple.zsh).
    # 以 xcodebuild 建置每支 app、裝到模擬器上，並經由 XCUITest runner 重放它的動作檔。
    - name: iOS sweep
      run: zsh testapp/sweep_apple.zsh --ios P114 P12

    # The sweep exits 0 whatever happened; every row of its table has to be a pass.
    # sweep 無論結果都以 0 結束；結果表的每一列都必須是 pass。
    - name: Every action file passes
      run: |
        t=testapp/output/ios-sweep.csv2
        csv2 -r -i "$t"
        total=$(csv2 -r --json -i "$t" | grep -c '"record":' || true)
        passed=$(csv2 -r --json -i "$t" | grep -c '"result":"pass"' || true)
        echo "$passed of $total pass"
        test "$total" -gt 0 && test "$passed" -eq "$total"

    - name: Upload captures and logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ios-sweep
        path: |
          testapp/output/ios-sweep.csv2
          testapp/output/*-ios-*.png
          testapp/output/*.log
        if-no-files-found: warn

  android:
    # An x86_64 Linux runner: GitHub's Apple Silicon runners cannot nest an emulator,
    # and Linux runners have KVM. The apps are built for x86_64 here (ANDROID_TRIPLE),
    # so the emulator runs them natively; the local machines use arm64.
    # x86_64 Linux runner:GitHub 的 Apple Silicon runner 無法再套一層 emulator,Linux runner 則有 KVM。
    # 這裡的 app 以 x86_64 建置(ANDROID_TRIPLE),emulator 原生執行；本機用的是 arm64。
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANDROID_TRIPLE: x86_64-unknown-linux-android31
      ANDROID_NDK_VERSION: 30.0.16248370
    steps:
    - uses: actions/checkout@v4

    - name: Check out Vendor/swift-winui
      run: git submodule update --init --depth 1 Vendor/swift-winui

    # The toolchain must be the exact release the Android SDK was built with.
    # toolchain 必須與 Android SDK 建置時所用的版本完全相同。
    - name: Install Swift 6.4.0
      uses: SwiftyLab/setup-swift@v1
      with:
        swift-version: '6.4.0'

    - name: Install zsh, csv2 and JDK 17
      run: |
        sudo apt-get update
        sudo apt-get install -y zsh zstd rsync
        v=0.2.0; f=csv2-$v-linux-x86_64-glibc.tar.zst
        curl -fsSLO "https://github.com/raliclo/csv2/releases/download/v$v/$f"
        curl -fsSLO "https://github.com/raliclo/csv2/releases/download/v$v/$f.sha256"
        sha256sum -c "$f.sha256"
        mkdir -p "$RUNNER_TEMP/csv2" && zstd -dc "$f" | tar -x -C "$RUNNER_TEMP/csv2"
        bin=$(find "$RUNNER_TEMP/csv2" -type f -name csv2 -perm -u+x | head -1)
        test -n "$bin"
        echo "${bin%/*}" >> "$GITHUB_PATH"

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    # NDK r30, which the Swift 6.4 Android SDK requires; the checksum is the one
    # swift.org publishes (also in testapp/install_tools_android.zsh).
    # NDK r30 是 Swift 6.4 Android SDK 所需；checksum 是 swift.org 公布的那一個(亦見 install_tools_android.zsh)。
    - name: Install the NDK and the Swift Android SDK
      run: |
        sdkmanager=$(ls "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager)
        yes | "$sdkmanager" --licenses > /dev/null || true
        "$sdkmanager" --install "ndk;$ANDROID_NDK_VERSION"
        ndk="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
        test -d "$ndk/toolchains/llvm/prebuilt"
        echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
        swift sdk install \
          https://download.swift.org/swift-6.4.0-release/android-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_android.artifactbundle.tar.gz \
          --checksum 21fb555122a3d801ad943d48df7ebffdd8824de61c25c180bb792d3edaee0b43
        bundle=$(ls -d "$HOME"/.swiftpm/swift-sdks/*android.artifactbundle)
        ANDROID_NDK_HOME="$ndk" bash "$bundle/swift-android/scripts/setup-android-sdk.sh"
        swift sdk list

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # Builds, packages and installs each app, then replays its action files
    # (testapp/sweep_android.zsh), on an emulator this step starts.
    # 建置、打包並安裝每支 app,再重放它的動作檔(sweep_android.zsh),在這一步啟動的 emulator 上。
    - name: Android sweep
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
        script: mkdir -p testapp/output && zsh testapp/sweep_android.zsh P114 P12 2>&1 | tee testapp/output/android-sweep-stdout.txt

    # The sweep exits 0 whatever happened. Its last count line is the verdict: a row passes
    # when test.zsh exited 0 and the app launched (sweep_android.zsh), and none may fail.
    # sweep 無論結果都以 0 結束。最後那行計數就是結論：test.zsh 以 0 結束且 app 有啟動才算通過，不能有任何一列失敗。
    - name: Every action file passes
      run: |
        csv2 -r -i testapp/output/android-sweep.csv2
        line=$(grep -E '^[0-9]+ launched, [0-9]+ did not' testapp/output/android-sweep-stdout.txt)
        echo "$line"
        echo "$line" | grep -qE '^[1-9][0-9]* launched, 0 did not'

    - name: Upload captures and logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-sweep
        path: |
          testapp/output/android-sweep.csv2
          testapp/output/android-sweep-stdout.txt
          testapp/output/*-android-*.png
          testapp/output/*.log
        if-no-files-found: warn

  linux:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    # Package.swift takes swift-winui by path from this submodule on every host
    # (2026-11-06), and checkout@v4 leaves submodules empty.
    # Package.swift 在每個主機上都以路徑引用這個 submodule(2026-11-06),checkout@v4 不會取出 submodule。
    - name: Check out Vendor/swift-winui
      run: git submodule update --init --depth 1 Vendor/swift-winui

    - name: Install Swift 6.4
      uses: SwiftyLab/setup-swift@v1
      with:
        swift-version: '6.4'

    - name: Swift version
      run: swift --version

    - name: Install GTK and a virtual X display
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-4-dev clang zsh xvfb x11-xserver-utils

    - name: Build GtkBackend
      run: SCUI_HOST_BACKENDS_ONLY=1 swift build --target GtkBackend

    - name: Test
      run: SCUI_HOST_BACKENDS_ONLY=1 xvfb-run --auto-servernum swift test

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@v4

    # Package.swift takes swift-winui by path from this submodule on every host
    # (2026-11-06), and checkout@v4 leaves submodules empty.
    # Package.swift 在每個主機上都以路徑引用這個 submodule(2026-11-06),checkout@v4 不會取出 submodule。
    - name: Check out Vendor/swift-winui
      run: git submodule update --init --depth 1 Vendor/swift-winui

    - name: Setup VS Dev Environment
      uses: seanmiddleditch/gha-setup-vsdevenv@v5

    - name: Install Swift 6.4.2
      uses: compnerd/gha-setup-swift@v0.3.0
      with:
        branch: swift-6.4.2-release
        tag: 6.4.2-RELEASE

    - name: Swift version
      run: swift --version

    - name: Build WinUIBackend
      run: swift build --target WinUIBackend

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: SwiftLint
      uses: norio-nomura/action-swiftlint@3.2.1
