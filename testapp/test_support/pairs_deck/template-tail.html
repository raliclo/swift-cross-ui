</div></div>

<form id="jump" data-prevent-swipe><label for="jump-app">App</label><input id="jump-app" inputmode="numeric" placeholder="50" type="text" pattern="[0-9]*" aria-label="App number" autocomplete="off"><button type="submit">Go</button><button type="button" id="grid">Grid</button><span class="zoom"><button type="button" id="zoom-out" aria-label="Zoom out">−</button><button type="button" id="zoom-reset" aria-label="Reset zoom">100%</button><button type="button" id="zoom-in" aria-label="Zoom in">+</button></span></form>
<div id="tiles" data-prevent-swipe hidden><div class="bar"><b>All apps</b><button type="button" id="tiles-close">Close</button></div><div class="wrap"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/reveal.min.js"></script>
<script>
Reveal.initialize({
  width: @@SLIDE_W@@, height: @@SLIDE_H@@, margin: 0.03, minScale: 0.1, maxScale: 2,
  hash: false, history: false, respondToHashChanges: false, scrollActivationWidth: null, slideNumber: 'c/t', transition: 'none', backgroundTransition: 'none',
  center: false, preloadIframes: false, viewDistance: 3, mobileViewDistance: 2, embedded: false

var sections = Array.prototype.slice.call(document.querySelectorAll('.slides > section'));
function jumpTo(text, done) {
  var n = parseInt(String(text).replace(/\D/g, ''), 10);
  var i = sections.findIndex(function (s) { return s.dataset.app === 'P' + n; });
  if (i >= 0) { Reveal.slide(i); if (done) document.getElementById('jump-app').blur(); }
}
var field = document.getElementById('jump-app');
field.addEventListener('input', function () { jumpTo(field.value, false); });
document.getElementById('jump').addEventListener('submit', function (e) { e.preventDefault(); jumpTo(field.value, true); });
// The box shows the app on screen, however the deck got there.
function showApp() { var c = Reveal.getCurrentSlide(); if (document.activeElement !== field) field.value = c && c.dataset.app ? c.dataset.app.slice(1) : ''; }
Reveal.on('slidechanged', showApp); Reveal.on('ready', showApp);
var tiles = document.getElementById('tiles'), wrap = tiles.querySelector('.wrap');
function showTiles(on) {
  if (on && !wrap.firstChild) {
    sections.forEach(function (s, i) {
      if (!s.dataset.app) return;
      var b = document.createElement('button'); b.type = 'button';
      var img = document.createElement('img'); img.loading = 'lazy'; img.alt = '';
      img.src = 'img/@@TILE_SIDE@@-' + s.dataset.app.toLowerCase() + '.jpg';
      b.appendChild(img); b.appendChild(document.createTextNode(s.dataset.app.slice(1)));
      b.addEventListener('click', function (e) {
        e.preventDefault(); e.stopPropagation();
        field.value = s.dataset.app.slice(1);
        showTiles(false); Reveal.slide(i);

}
document.getElementById('grid').addEventListener('click', function () { showTiles(true); });
document.getElementById('tiles-close').addEventListener('click', function () { showTiles(false); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') showTiles(false); });
// Zoom, per page: − and + scale the whole page on screen about the middle of the view, the level button
// goes back to 100%. Each page keeps its own level and position. The page may grow past its own box to
// fill the screen: on a phone the slide is shrunk to a band across the middle, and zooming only inside
// that band showed almost nothing. A long press (0.35 s without moving) turns the pointer into a hand;
// dragging then moves the page.
var ZMIN = 1, ZMAX = 8, ZSTEP = 1.25, HOLD_MS = 350, SLOP = 6;
var zoomReset = document.getElementById('zoom-reset');
function slideBox() {

  // Bigger than the screen: no edge may come inside it. Smaller: centred.
  function clamp(t, size, view) {
    var span = size * st.z, o = (view - size) / 2;

  }

  sec.style.transformOrigin = '0 0';
  sec.style.transform = st.z === 1 ? '' : 'translate(' + st.x + 'px,' + st.y + 'px) scale(' + st.z + ')';
  sec.classList.toggle('zoomed', st.z > 1);

  if (sec === Reveal.getCurrentSlide()) zoomReset.textContent = Math.round(st.z * 100) + '%';
}
sections.forEach(function (sec) {
  sec.zoom = { z: 1, x: 0, y: 0 };
  sec.querySelectorAll('img').forEach(function (img) { img.draggable = false; });
  sec.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  var hold = null, drag = null, start = null;
  function endHold() { clearTimeout(hold); hold = null; }
  sec.addEventListener('pointerdown', function (e) {
    if (e.button !== 0 || Reveal.isOverview()) return;

    endHold();
    hold = setTimeout(function () {
      hold = null;
      drag = { x: start.x, y: start.y, s: Reveal.getScale() || 1 };

    if (hold && start && Math.hypot(e.clientX - start.x, e.clientY - start.y) > SLOP) endHold();

    sec.zoom.x += (e.clientX - drag.x) / drag.s; sec.zoom.y += (e.clientY - drag.y) / drag.s;
    drag.x = e.clientX; drag.y = e.clientY;
    applyZoom(sec);
  });

    endHold();
    if (!drag) return;

});
function zoomBy(f) {
  var sec = Reveal.getCurrentSlide(); if (!sec || !sec.zoom || Reveal.isOverview()) return;
  var st = sec.zoom, b = slideBox(), z = Math.max(ZMIN, Math.min(ZMAX, f ? st.z * f : 1));

  applyZoom(sec);
}
document.getElementById('zoom-in').addEventListener('click', function () { zoomBy(ZSTEP); });
document.getElementById('zoom-out').addEventListener('click', function () { zoomBy(1 / ZSTEP); });
zoomReset.addEventListener('click', function () { zoomBy(0); });
function showZoom() { var c = Reveal.getCurrentSlide(); zoomReset.textContent = Math.round((c && c.zoom ? c.zoom.z : 1) * 100) + '%'; }
Reveal.on('slidechanged', showZoom); Reveal.on('ready', showZoom);
// The overview and a resize lay the pages out again; put each zoom back afterwards.
Reveal.on('overviewhidden', function () { sections.forEach(applyZoom); });
Reveal.on('resize', function () { sections.forEach(applyZoom); });
// A tap on a note shows all of it when three lines cut it off; another tap folds it. A press that became
// a drag never gets here: the page stops that click.
document.addEventListener('click', function (e) {
  var n = e.target.closest ? e.target.closest('.note, .cmp') : null;
  if (n) n.classList.toggle('open');
});
// A side with no screenshot shows a box the size of one, saying why, instead of an empty gap that reads
// as a picture that failed to load. The reason comes from the "Not expected" list on the last slide when
// the side is listed there, otherwise from the caption.
function missingZh(w) {
  if (w === 'no screenshot (exit not run)') return '未執行，沒有截圖';
  var m = /^no screenshot \(exit (.*)\)$/.exec(w); if (m) return '沒有截圖(exit ' + m[1] + ')';
  if (w === 'not in the GTK / macOS deck') return '不在 GTK / macOS 簡報中';
  return w;
}
var notExpected = {};
document.querySelectorAll('.todo .known li').forEach(function (li) { notExpected[li.dataset.app + '/' + li.dataset.side] = li; });
document.querySelectorAll('.slides > section[data-app] .pair figure').forEach(function (fig) {
  if (fig.querySelector('img')) return;
  var cap = fig.querySelector('figcaption'), b = cap && cap.querySelector('b');
  if (!b) return;
  var app = fig.closest('section').dataset.app, li = notExpected[app + '/' + b.textContent];
  var t = cap.textContent, why = t.slice(t.lastIndexOf(' · ') + 3);
  var box = document.createElement('div'), en = document.createElement('span'), zh = document.createElement('span');
  box.className = 'missing' + (li ? ' known' : '');
  en.textContent = li ? 'Not expected: ' + li.dataset.en : 'Missing: ' + why;
  zh.className = 'zh'; zh.lang = 'zh-Hant-TW';
  zh.textContent = li ? '預期沒有：' + li.dataset.zh : '缺少：' + missingZh(why);
  box.appendChild(en); box.appendChild(zh);
  fig.insertBefore(box, cap);
});
