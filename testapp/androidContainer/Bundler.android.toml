# Android settings for every test app, tracked rather than defaulted.
#
# The counterpart of iosContainer/appTemplate.app and macContainer/appTemplate.app,
# and it exists for the same reason: a build should not take its identity from
# whatever happened to be installed.
#
# Those two supply an Info.plist because SwiftPM produces a bare Mach-O with no
# bundle identifier. Android does not need that -- swift-bundler emits a complete
# APK -- so nothing here is load-bearing in the way an Info.plist is. What it
# fixes is subtler: compile.zsh generated a Bundler.toml carrying only
# identifier, product and version, so every Android API level came from
# swift-bundler's defaults and from whichever build-tools the SDK happened to
# have. Read off the last APK built without this file:
#
#   package dev.swiftcrossui.testapp.p12  compileSdk 35  minSdk 28  targetSdk 35
#
# Nobody chose 35. It is what build-tools 35.0.0 gave, and installing 36 would
# have moved it with no diff to review and no failure to notice.
#
# Android 相關設定，納入版本控制而非依賴預設值。
#
# 這是 iosContainer/appTemplate.app 與 macContainer/appTemplate.app 的對應物，存在理由也相同：
# 一次建置不該從「機器上剛好裝了什麼」取得它的身分。
#
# 那兩者提供 Info.plist，是因為 SwiftPM 產出的裸 Mach-O 沒有 bundle identifier。Android 不需要
# 這個——swift-bundler 會產出完整的 APK——因此此處沒有任何一項像 Info.plist 那樣是「不可或缺」的。
# 它修正的是更細微的事：compile.zsh 所產生的 Bundler.toml 只帶 identifier、product 與 version，
# 於是每一個 Android API level 都來自 swift-bundler 的預設值，以及該 SDK 恰好安裝了哪個
# build-tools。自「尚未有本檔時所建的最後一個 APK」讀出的值即為上方所列。
#
# 沒有人選過 35。那是 build-tools 35.0.0 給的值，而改裝 36 就會讓它跟著移動——沒有可供審閱的
# diff，也沒有任何失敗可供察覺。
#
# This file is the body of an `[apps.<Pn>.android]` table. compile.zsh emits the
# header for each requested app and appends these lines verbatim, so every test
# app gets the same Android configuration and there is one place to change it.
# 本檔是 `[apps.<Pn>.android]` 表格的內容。compile.zsh 會為每一個被請求的 app 產生表頭，並原樣
#附加以下各行，因此所有測試 app 取得相同的 Android 設定，且只有一處需要修改。

# snake_case, not the Swift spelling.
#
# Swift Bundler's `@Configuration` macro converts each field's lowerCamelCase
# identifier to snake_case for TOML -- `lowerCamelCaseToSnakeCase` in
# ConfigurationMacro.swift -- so the Swift field `minSDK` is the TOML key
# `min_sdk`. This file used `minSDK`, `targetSDK` and `compileSDK` from the day
# it was written, and was rejected whole:
#
#   error: Failed to deserialize configuration
#   Caused by: Encountered unexpected keys 'apps.P12.android.minSDK', ...
#
# Nothing noticed, because Android could not be built at all until 2026-09-02
# and the file had never been read. Its own comment above, claiming the last
# APK carried minSDK 28, is the evidence: 28 is swift-bundler's default, which
# is what an ignored file leaves you with.
#
# 使用 snake_case，而非 Swift 的拼法。
#
# Swift Bundler 的 `@Configuration` macro 會把每個欄位的 lowerCamelCase 識別字轉換為 TOML 的
# snake_case——見 ConfigurationMacro.swift 中的 `lowerCamelCaseToSnakeCase`——因此 Swift 欄位
# `minSDK` 對應的 TOML 鍵是 `min_sdk`。本檔自撰寫之日起即使用 `minSDK`、`targetSDK` 與
# `compileSDK`，因而整份被拒絕，錯誤訊息如上方英文所示。
#
# 沒有任何東西察覺到這件事，因為在 2026-09-02 之前 Android 根本建不起來，本檔從未被讀取過。
# 上方它自己的註解宣稱「上一個 APK 帶的是 minSDK 28」，正是證據：28 是 swift-bundler 的預設值，
# 而那正是一個被忽略的檔案會留給你的結果。

# Matches ANDROID_TRIPLE in compile.zsh, which is
# aarch64-unknown-linux-android31. The two are the same decision written twice,
# so a change to either has to be made to both; this pair was raised together
# on 2026-09-02.
#
# **Raised from 28 to 31 for RenderEffect.** `android.graphics.RenderEffect` --
# the only public way to blur or colour-adjust a live View subtree, and so the
# only way AndroidBackend can implement `BackendFeatures.VisualEffects` -- is
# API 31. At 28 it could be reached only behind a runtime version check, which
# would mean an AndroidBackend that supports the feature on some devices and
# not others while still claiming the conformance; the conformance is not
# conditional, so that would be a lie on every device below 31.
#
# The cost is real and is the reason 28 was chosen first: API 28 is Android 9
# (2018) and 31 is Android 12 (2021), so this drops devices in between. For a
# tree of test apps that is an acceptable trade; for a library release it is a
# decision someone should take deliberately rather than inherit from here.
#
# 與 compile.zsh 中的 ANDROID_TRIPLE（aarch64-unknown-linux-android31）一致。兩者是同一個決定
# 寫了兩次，因此任一方更動時都必須同時更動另一方；這一對已於 2026-09-02 一併調升。
#
# **為了 RenderEffect 而由 28 調升至 31。** `android.graphics.RenderEffect`——公開 API 中唯一能對
# 一棵活的 View 子樹做模糊或色彩調整的手段，因而也是 AndroidBackend 實作
# `BackendFeatures.VisualEffects` 的唯一途徑——屬於 API 31。在 28 之下只能藏在執行期版本檢查之後，
# 那會造就一個「在某些裝置上支援、在其他裝置上不支援，卻依然宣稱符合該 conformance」的
# AndroidBackend；而 conformance 並非條件式的，因此在所有低於 31 的裝置上那都會是謊言。
#
# 代價是真實的，也正是當初選 28 的理由：API 28 是 Android 9（2018），31 是 Android 12（2021），
# 因此這會捨棄兩者之間的裝置。對一棵測試 app 的樹而言這是可接受的取捨；但對一次函式庫發布而言，
# 這是應該由某個人刻意做出、而非從此處繼承而來的決定。
min_sdk = 31

# The apps could not reach the network. There was no `<uses-permission>` element
# in the generated manifest at all, because nothing here asked for one, and on
# Android a missing permission does not raise -- the request just fails.
# Measured 2026-09-03: P38's WebView drew Chromium's own error page with
# `net::ERR_CACHE_MISS`, which reads like a caching problem and is not one, and
# P26's AsyncImage would hit the same wall. The emulator itself had network the
# whole time.
#
# INTERNET only. It is what a WebView and an image load need, and adding more
# because they might one day be useful is how a test tree ends up requesting
# permissions no reviewer can account for.
#
# 這些 app 連不上網路。產生的 manifest 中根本沒有任何 `<uses-permission>` 元素，因為此處沒有任何
# 東西要求過；而在 Android 上，缺少權限並不會拋出錯誤——請求只是會失敗。2026-09-03 實測：P38 的
# WebView 畫出了 Chromium 自己的錯誤頁，內容是 `net::ERR_CACHE_MISS`——那看起來像是快取問題，
# 但並不是；而 P26 的 AsyncImage 會撞上同一堵牆。emulator 本身自始至終都有網路。
#
# 只加 INTERNET。那是 WebView 與載入圖片所需要的；而「因為將來可能用得到就先加進去」，正是一棵
# 測試樹最後會請求一堆沒有人能交代的權限的原因。
permissions = ["INTERNET"]

# The API the apps are written against. 35 is what the last build produced, so
# pinning it changes nothing today -- which is the point. It stops moving on its
# own the next time the SDK is updated.
# 這些 app 所針對的 API。35 是上一次建置實際產出的值，因此釘住它在今天不改變任何事——而那正是
# 重點：它不會在下次更新 SDK 時自行移動。
target_sdk = 35

# The API used to compile the Kotlin helpers in Sources/AndroidBackend/Kotlin.
# Kept equal to targetSDK rather than raised. It was briefly 36 while
# AndroidBackendHelpers.kt called TimeZone.getIanaID, which is API 36; b33f6246
# rewrote that helper to stay within the API the current Swift Android SDK uses,
# so the reason to raise it is gone. Raise it again only with a call site that
# needs it.
# 用於編譯 Sources/AndroidBackend/Kotlin 中 Kotlin 輔助程式的 API。此處與 targetSDK 保持相同而
# 不調高。它曾短暫為 36，因為 AndroidBackendHelpers.kt 呼叫了屬於 API 36 的 TimeZone.getIanaID；
# b33f6246 已改寫該輔助程式，使其停留在現行 Swift Android SDK 所使用的 API 範圍內，因此調高的
# 理由已不存在。除非有確實需要它的呼叫點，否則不要再調高。
compile_sdk = 35

# version_code is deliberately absent. Left unset it defaults to the git revision
# number -- the last APK carried 1052 -- which is what a throwaway test build
# should have: two builds from different commits are distinguishable, and
# installing one over the other is never refused for being older.
# version_code 刻意不設定。留空時它預設為 git 的 revision number——上一個 APK 帶的是 1052——而那
# 正是一次性測試建置所應有的：來自不同 commit 的兩個建置可以區分，且以其一覆蓋安裝另一個時，
# 不會因為「版本較舊」而被拒絕。
